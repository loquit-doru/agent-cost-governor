name: Deploy site to GitHub Pages (optional preview)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  notice:
    if: ${{ vars.ENABLE_GITHUB_PAGES_PREVIEW != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages preview disabled
        run: |
          echo "GitHub Pages preview is disabled."
          echo "To enable this workflow, add a repository variable:"
          echo "  ENABLE_GITHUB_PAGES_PREVIEW=true"
          echo "Otherwise, use Cloudflare Pages via the 'Deploy site to Cloudflare Pages' workflow."

  deploy:
    if: ${{ vars.ENABLE_GITHUB_PAGES_PREVIEW == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
