# Disabled — deploy manually with: npm run deploy:site
# Re-enable by adding CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets to GitHub.
name: Deploy site to Cloudflare Pages (proceedgate.dev)

on:
  workflow_dispatch:

jobs:
  deploy:
    if: false  # disabled — secrets not configured
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'proceedgate' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name ${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch main
