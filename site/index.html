<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProceedGate — A circuit breaker for AI agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script defer src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script defer src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Three.js is loaded lazily only if the 3D scene is visible -->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #050510;
    color: #fff;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  nav,
  section.section-pad,
  footer { zoom: 1; }

  /* ── Unified card animation (matches In-Action panels) ───────────── */
  @keyframes cardSweep {
    0%   { transform: translateX(-100%); opacity: 0; }
    50%  { opacity: 1; }
    100% { transform: translateX(100%); opacity: 0; }
  }
  @keyframes cardPulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(45,212,191,0.0), 0 0 0 0 rgba(45,212,191,0); }
    50%      { box-shadow: 0 0 0 1px rgba(45,212,191,0.35), 0 0 24px -4px rgba(45,212,191,0.25); }
  }
  @keyframes accentBlink {
    0%, 70%, 100% { opacity: 1; }
    80%, 90%      { opacity: 0.45; }
  }
  .hiw-card,
  .feat-card,
  .pay-stat,
  .pay-compare-card {
    position: relative;
    overflow: hidden;
    transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease, background .35s ease;
  }
  .hiw-card,
  .price-card {
    position: relative;
    transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease, background .35s ease;
  }
  .hiw-card::after,
  .feat-card::after,
  .price-card::after,
  .pay-stat::after,
  .pay-compare-card::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, #2dd4bf 50%, transparent 100%);
    transform: translateX(-100%); opacity: 0;
    pointer-events: none;
  }
  .hiw-card:hover,
  .feat-card:hover,
  .price-card:hover,
  .pay-stat:hover,
  .pay-compare-card:hover {
    transform: translateY(-6px);
    border-color: rgba(45,212,191,0.45) !important;
    background: linear-gradient(180deg, rgba(45,212,191,0.06), rgba(255,255,255,0.01));
    box-shadow: 0 16px 40px -12px rgba(45,212,191,0.25), 0 0 0 1px rgba(45,212,191,0.25);
  }
  .hiw-card:hover::after,
  .feat-card:hover::after,
  .price-card:hover::after,
  .pay-stat:hover::after,
  .pay-compare-card:hover::after {
    animation: cardSweep 1.2s ease-out;
  }
  /* Numbers/icons get teal accent + subtle blink loop */
  .hiw-num,
  .feat-icon,
  .pay-stat-num {
    animation: accentBlink 4.5s ease-in-out infinite;
  }
  .hiw-card:hover .hiw-num,
  .feat-card:hover .feat-icon,
  .pay-stat:hover .pay-stat-num {
    color: #2dd4bf !important;
    text-shadow: 0 0 12px rgba(45,212,191,0.45);
  }
  /* Featured price card already teal — give it a permanent gentle pulse */
  .price-card.featured {
    animation: cardPulse 3.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .hiw-num, .feat-icon, .pay-stat-num,
    .price-card.featured { animation: none; }
  }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ── Background: blockchain-themed ──────────────────────────────── */
  /* Hex pattern (BNB-style) */
  .bg-hex {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.5;
    mask-image: radial-gradient(ellipse 80% 70% at center, black 20%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at center, black 20%, transparent 85%);
  }
  .bg-hex svg { width: 100%; height: 100%; }

  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(800px circle at 20% 20%, rgba(45,212,191,.12), transparent 50%),
      radial-gradient(600px circle at 80% 70%, rgba(168,85,247,.10), transparent 50%),
      radial-gradient(500px circle at 50% 100%, rgba(59,130,246,.08), transparent 50%);
  }



  /* Chain of blocks drifting horizontally */
  .bg-chain {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
    mask-image: radial-gradient(ellipse 90% 90% at center, transparent 30%, black 60%, transparent 95%);
    -webkit-mask-image: radial-gradient(ellipse 90% 90% at center, transparent 30%, black 60%, transparent 95%);
  }
  .bg-chain-row {
    position: absolute; left: -10%; right: -10%;
    display: flex; gap: 60px; align-items: center;
    animation: drift 90s linear infinite;
    opacity: 0.5;
  }
  .bg-chain-row.r1 { top: 12%; }
  .bg-chain-row.r2 { top: 38%; animation-duration: 110s; animation-direction: reverse; }
  .bg-chain-row.r3 { top: 64%; animation-duration: 80s; }
  .bg-chain-row.r4 { top: 88%; animation-duration: 100s; animation-direction: reverse; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .bg-block {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 3px;
    padding: 8px 12px;
    border: 1px solid rgba(45,212,191,0.18);
    border-radius: 4px;
    background: rgba(45,212,191,0.03);
    font-family: 'JetBrains Mono', monospace;
    color: rgba(45,212,191,0.4);
    backdrop-filter: blur(4px);
    min-width: 140px;
  }
  .bg-block-num { font-size: 11px; font-weight: 600; }
  .bg-block-hash { font-size: 9px; color: rgba(161,161,170,0.4); letter-spacing: 0.5px; }
  .bg-block-meta { font-size: 9px; color: rgba(161,161,170,0.35); }
  .bg-chain-link {
    flex-shrink: 0;
    width: 24px; height: 1px;
    background: linear-gradient(90deg, rgba(45,212,191,0.4), rgba(45,212,191,0.1));
    position: relative;
  }
  .bg-chain-link::after {
    content: '→';
    position: absolute; right: -6px; top: -7px;
    color: rgba(45,212,191,0.3); font-size: 11px;
  }

  /* Floating tx hash columns at far edges */
  .bg-hashes {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .bg-hash-col {
    position: absolute; top: -120px;
    display: flex; flex-direction: column; gap: 24px;
    animation: rain 60s linear infinite;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: rgba(45,212,191,0.25);
    line-height: 1.4;
  }
  .bg-hash-col.c1 { left: 1.5%; }
  .bg-hash-col.c2 { left: 96%;  animation-duration: 75s; }
  @keyframes rain {
    from { transform: translateY(0); }
    to   { transform: translateY(50%); }
  }
  .bg-hash-line { white-space: nowrap; }
  .bg-hash-line.dim { opacity: 0.45; }
  .bg-hash-line.hot { color: rgba(74,222,128,0.5); }
  .bg-hash-line.cold { color: rgba(248,113,113,0.5); }

  /* ── Nav ────────────────────────────────────────────────────────── */
  nav {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 100;
    display: flex; align-items: center; gap: 4px;
    padding: 6px 6px 6px 24px;
    background: rgba(10, 10, 18, 0.6);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 100px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 16px; letter-spacing: -0.02em;
    padding-right: 20px; border-right: 1px solid rgba(255,255,255,0.08);
    margin-right: 12px;
  }
  .nav-logo-mark {
    width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    box-shadow: 0 0 20px rgba(45,212,191,0.5);
  }
  .nav-link {
    font-size: 15px; font-weight: 500; color: #a1a1aa;
    padding: 9px 16px; border-radius: 100px; transition: all .2s;
  }
  .nav-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .nav-cta {
    font-size: 15px; font-weight: 600;
    padding: 9px 20px; border-radius: 100px;
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    color: #000; margin-left: 8px;
    box-shadow: 0 4px 16px rgba(45,212,191,0.3);
    transition: transform .2s, box-shadow .2s;
  }
  .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(45,212,191,0.5); }

  /* ── Hero ───────────────────────────────────────────────────────── */
  .hero {
    position: relative; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 120px 40px 80px;
    z-index: 1;
    overflow: hidden;
  }
  .hero-content {
    position: relative; z-index: 5;
    max-width: 900px; text-align: center;
  }
  .hero-content::before {
    content: ''; position: absolute; inset: -20px -60px -10px;
    background: radial-gradient(ellipse 60% 70% at center, rgba(5,5,16,0.85) 0%, rgba(5,5,16,0.55) 50%, transparent 80%);
    z-index: -1; pointer-events: none;
    filter: blur(14px);
  }
  .hero h1 {
    text-shadow: 0 4px 30px rgba(5, 5, 16, 0.6);
  }
  .hero-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 16px 6px 8px; margin-bottom: 32px;
    background: rgba(45,212,191,0.08);
    border: 1px solid rgba(45,212,191,0.25);
    border-radius: 100px;
    font-size: 12px; color: #2dd4bf; font-weight: 500;
    backdrop-filter: blur(10px);
  }
  .hero-pill-badge {
    background: #2dd4bf; color: #000;
    padding: 2px 10px; border-radius: 100px;
    font-size: 10px; font-weight: 700;
  }
  .hero h1 {
    font-size: clamp(48px, 7vw, 96px); font-weight: 800;
    letter-spacing: -0.04em; line-height: 0.95;
    background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero h1 .accent {
    background: linear-gradient(135deg, #2dd4bf 0%, #06b6d4 50%, #8b5cf6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    font-size: clamp(16px, 1.4vw, 20px);
    color: #a1a1aa; line-height: 1.6;
    max-width: 600px; margin: 32px auto 0;
  }
  .hero-cta {
    display: flex; gap: 12px; justify-content: center; margin-top: 48px; flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 24px; border-radius: 100px;
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    color: #000; font-weight: 600; font-size: 14px;
    box-shadow: 0 8px 32px rgba(45,212,191,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform .2s, box-shadow .2s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(45,212,191,0.5), inset 0 1px 0 rgba(255,255,255,0.4); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 24px; border-radius: 100px;
    background: rgba(255,255,255,0.05);
    color: #fff; font-weight: 500; font-size: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    transition: all .2s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

  /* ── Stats marquee ──────────────────────────────────────────────── */
  .stats-marquee {
    position: relative; z-index: 1;
    margin-top: 80px;
    padding: 24px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.01);
    overflow: hidden;
  }
  .stats-row {
    display: flex; gap: 80px;
    animation: scroll 30s linear infinite;
    width: max-content;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .stat {
    display: flex; align-items: baseline; gap: 12px; white-space: nowrap;
  }
  .stat-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-lbl { font-size: 13px; color: #71717a; text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── Flow Demo (the storyteller) ────────────────────────────────── */
  .flow-demo {
    position: relative; z-index: 1;
    margin: -40px auto 0; padding: 32px;
    max-width: 1180px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 80px rgba(0,0,0,0.4);
  }
  /* Background variant: fills hero behind headline */
  .flow-demo.bg {
    position: absolute;
    inset: 80px 0 40px;
    max-width: none;
    margin: 0;
    background: transparent;
    border: none; box-shadow: none;
    backdrop-filter: none;
    border-radius: 0;
    padding: 20px 60px;
    pointer-events: none;
    z-index: 0;
  }
  .flow-demo.bg .flow-demo-header { opacity: 0.5; padding: 0 4px; }
  .flow-demo.bg .flow-gate-card { display: none; }
  .flow-demo.bg .flow-grid {
    grid-template-columns: 220px 1fr 220px;
    min-height: calc(100vh - 240px);
    align-items: stretch;
  }
  .flow-demo.bg .flow-agents,
  .flow-demo.bg .flow-outcomes {
    justify-content: center;
  }
  .flow-demo.bg .flow-agent {
    background: rgba(10, 10, 18, 0.55);
    border-color: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
  }
  .flow-demo.bg .flow-outcome {
    background: rgba(10, 10, 18, 0.55);
    backdrop-filter: blur(12px);
  }
  .flow-demo.bg .flow-canvas {
    /* SVG passes BEHIND the centered headline */
    z-index: 0;
  }
  .flow-demo-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 0 8px;
  }
  .flow-demo-title {
    font-size: 12px; font-weight: 600; color: #71717a;
    letter-spacing: 0.15em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .flow-demo-live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: #4ade80; font-family: 'JetBrains Mono', monospace;
  }
  .flow-demo-live::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 8px #4ade80;
    animation: pulse-dot 1.5s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .flow-grid {
    display: grid;
    grid-template-columns: 240px 1fr 240px;
    gap: 0;
    position: relative;
    min-height: 360px;
  }
  /* Agents column */
  .flow-agents { display: flex; flex-direction: column; gap: 12px; padding: 12px 0; }
  .flow-agent {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    transition: all 0.2s;
  }
  .flow-agent.active {
    background: rgba(45,212,191,0.08);
    border-color: rgba(45,212,191,0.3);
    box-shadow: 0 0 20px rgba(45,212,191,0.15);
  }
  .flow-agent-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0; transition: box-shadow 0.3s;
  }
  .flow-agent.active .flow-agent-dot { box-shadow: 0 0 8px currentColor; }
  .flow-agent-name { color: #d4d4d8; font-size: 12px; }
  .flow-agent-meta { font-size: 10px; color: #52525b; margin-left: auto; }

  /* SVG canvas */
  .flow-canvas {
    position: relative;
    overflow: visible;
  }
  .flow-canvas svg {
    width: 100%; height: 100%;
    display: block;
  }

  /* Center gate visual */
  .flow-gate-card {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 16px 18px;
    background: linear-gradient(180deg, rgba(45,212,191,0.12), rgba(45,212,191,0.04));
    border: 1px solid rgba(45,212,191,0.4);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(45,212,191,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    z-index: 5;
    pointer-events: none;
  }
  .flow-gate-shield {
    width: 32px; height: 32px; color: #2dd4bf;
    filter: drop-shadow(0 0 8px rgba(45,212,191,0.6));
  }
  .flow-gate-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: #2dd4bf; font-weight: 700; letter-spacing: 0.1em;
  }
  .flow-gate-tps {
    font-size: 10px; color: #71717a; font-family: 'JetBrains Mono', monospace;
  }

  /* Outcomes column */
  .flow-outcomes { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 12px 0; }
  .flow-outcome {
    padding: 18px 18px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    transition: all 0.2s;
  }
  .flow-outcome.allowed { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.05); }
  .flow-outcome.blocked { border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.05); }
  .flow-outcome-row {
    display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em;
    margin-bottom: 6px; text-transform: uppercase;
  }
  .flow-outcome.allowed .flow-outcome-row { color: #4ade80; }
  .flow-outcome.blocked .flow-outcome-row { color: #f87171; }
  .flow-outcome-icon {
    width: 16px; height: 16px;
  }
  .flow-outcome-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1;
  }
  .flow-outcome.allowed .flow-outcome-num { color: #4ade80; }
  .flow-outcome.blocked .flow-outcome-num { color: #f87171; }
  .flow-outcome-sub {
    font-size: 11px; color: #71717a; margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Request dot pulse-ring */
  .flow-pulse {
    transform-origin: center;
    animation: pulseRing 0.8s ease-out forwards;
    pointer-events: none;
  }
  @keyframes pulseRing {
    0%   { r: 4; opacity: 1; }
    100% { r: 24; opacity: 0; }
  }

  /* ── Sections ───────────────────────────────────────────────────── */
  section { position: relative; z-index: 1; }
  .container { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  .section-pad { padding: 120px 0; }

  .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 600;
    color: #2dd4bf; letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: clamp(36px, 4.5vw, 64px); font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.05;
    background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
  }
  .section-desc {
    font-size: 17px; color: #a1a1aa; line-height: 1.6; max-width: 600px;
  }

  /* ── How it works cards ─────────────────────────────────────────── */
  .hiw-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
    margin-top: 64px;
  }
  .hiw-card {
    position: relative;
    padding: 40px 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    overflow: hidden;
    transition: transform .3s, border-color .3s;
  }
  .hiw-card:hover { transform: translateY(-6px); border-color: rgba(45,212,191,0.4); box-shadow: 0 16px 40px -12px rgba(45,212,191,0.25); }
  .hiw-card::before {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(135deg, transparent 30%, rgba(45,212,191,0.3), transparent 70%);
    border-radius: 22px; z-index: -1; opacity: 0; transition: opacity .3s;
  }
  .hiw-card:hover::before { opacity: 1; }
  .hiw-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 600;
    color: #2dd4bf; letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  .hiw-card h3 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .hiw-card p { font-size: 14px; color: #a1a1aa; line-height: 1.7; margin-bottom: 20px; }
  .hiw-snippet {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 12px 14px;
    color: #d4d4d8; line-height: 1.7;
  }
  .hiw-snippet .cm { color: #52525b; }
  .hiw-snippet .k  { color: #2dd4bf; }
  .hiw-snippet .s  { color: #fbbf24; }
  .hiw-snippet .n  { color: #f87171; }

  /* ── Features bento ─────────────────────────────────────────────── */
  .feat-grid {
    display: grid; grid-template-columns: 2fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 20px; margin-top: 64px;
  }
  .feat-card {
    position: relative;
    padding: 36px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    overflow: hidden;
    transition: transform .35s, border-color .35s, box-shadow .35s;
  }
  .feat-card:hover { transform: translateY(-6px); border-color: rgba(45,212,191,0.4); box-shadow: 0 16px 40px -12px rgba(45,212,191,0.25); }
  .feat-card::before {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(135deg, transparent 30%, rgba(45,212,191,0.3), transparent 70%);
    border-radius: 22px; z-index: -1; opacity: 0; transition: opacity .3s;
  }
  .feat-card:hover::before { opacity: 1; }
  .feat-card.featured { grid-row: span 2; }
  .feat-card .feat-glow {
    position: absolute; top: -50px; right: -50px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(45,212,191,0.15), transparent 70%);
    pointer-events: none;
  }
  .feat-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(45,212,191,0.2), rgba(6,182,212,0.1));
    border: 1px solid rgba(45,212,191,0.3);
    display: flex; align-items: center; justify-content: center;
    color: #2dd4bf; margin-bottom: 20px;
  }
  .feat-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.01em; }
  .feat-card p { font-size: 14px; color: #a1a1aa; line-height: 1.7; }
  .feat-card .feat-tag {
    display: inline-block; margin-top: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    background: rgba(45,212,191,0.08);
    border: 1px solid rgba(45,212,191,0.2);
    color: #2dd4bf;
    padding: 4px 10px; border-radius: 6px;
  }

  /* ── Big number callout ─────────────────────────────────────────── */
  .callout {
    position: relative; margin-top: 64px;
    padding: 60px;
    background:
      radial-gradient(circle at 30% 50%, rgba(45,212,191,0.15), transparent 50%),
      radial-gradient(circle at 70% 50%, rgba(139,92,246,0.1), transparent 50%),
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    overflow: hidden;
  }
  .callout-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px;
    text-align: center;
  }
  .callout-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(36px, 4vw, 56px); font-weight: 800;
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  .callout-lbl { font-size: 12px; color: #71717a; text-transform: uppercase; letter-spacing: 0.1em; }

  /* ── Pricing ────────────────────────────────────────────────────── */
  .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 64px; padding-top: 22px; }
  .price-card {
    position: relative;
    padding: 40px 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    transition: transform .35s, border-color .35s, box-shadow .35s;
  }
  .price-card:hover { transform: translateY(-6px); border-color: rgba(45,212,191,0.4); box-shadow: 0 16px 40px -12px rgba(45,212,191,0.25); }
  .price-card::before {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(135deg, transparent 30%, rgba(45,212,191,0.3), transparent 70%);
    border-radius: 22px; z-index: -1; opacity: 0; transition: opacity .3s;
  }
  .price-card:hover::before { opacity: 1; }
  .price-card.featured {
    background:
      radial-gradient(circle at 50% 0%, rgba(45,212,191,0.15), transparent 70%),
      linear-gradient(180deg, rgba(45,212,191,0.05), rgba(255,255,255,0.01));
    border-color: rgba(45,212,191,0.3);
  }
  .price-badge {
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%);
    padding: 6px 16px;
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    color: #000; font-size: 11px; font-weight: 700;
    border-radius: 100px; letter-spacing: 0.05em;
    box-shadow: 0 4px 16px rgba(45,212,191,0.4);
  }
  .price-name { font-size: 14px; color: #a1a1aa; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 16px; }
  .price-num {
    display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .price-num .dollar { font-size: 24px; color: #71717a; font-weight: 600; }
  .price-num .amount { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .price-period { font-size: 13px; color: #71717a; margin-bottom: 20px; }
  .price-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 24px 0; }
  .price-feats li {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 8px 0; font-size: 14px; color: #d4d4d8;
  }
  .price-feats li svg { color: #2dd4bf; flex-shrink: 0; margin-top: 2px; }
  .price-cta {
    display: block; text-align: center; margin-top: 28px;
    padding: 12px; border-radius: 12px; font-weight: 600; font-size: 14px;
    transition: all .2s;
  }
  .price-cta.primary {
    background: linear-gradient(135deg, #2dd4bf, #06b6d4);
    color: #000;
    box-shadow: 0 4px 16px rgba(45,212,191,0.3);
  }
  .price-cta.primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(45,212,191,0.5); }
  .price-cta.ghost {
    background: rgba(255,255,255,0.05);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .price-cta.ghost:hover { background: rgba(255,255,255,0.1); }

  /* ── SDK strip (continuous marquee) ─────────────────────────────── */
  .sdk-strip {
    margin: 80px 0 0;
    padding: 32px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.01);
    overflow: hidden;
  }
  .sdk-row {
    display: flex; align-items: center; gap: 80px;
    animation: scroll 25s linear infinite;
    width: max-content;
  }
  .sdk-item {
    display: flex; align-items: center; gap: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 18px;
    color: #71717a; font-weight: 600;
    white-space: nowrap;
    transition: color .3s;
  }
  .sdk-item:hover { color: #2dd4bf; }
  .sdk-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 12px currentColor;
  }

  /* ── In Action (tabs + panel) ───────────────────────────────────── */
  .ia-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 56px; padding-bottom: 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .ia-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 100px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 13px; color: #a1a1aa; font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .ia-tab:hover { color: #fff; border-color: rgba(255,255,255,0.18); }
  .ia-tab.active {
    background: rgba(45,212,191,0.10);
    border-color: rgba(45,212,191,0.4);
    color: #2dd4bf;
    box-shadow: 0 0 24px rgba(45,212,191,0.15);
  }
  .ia-tab svg { width: 16px; height: 16px; }
  .ia-panel {
    margin-top: 28px;
    padding: 36px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    backdrop-filter: blur(20px);
  }
  .ia-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px; margin-bottom: 24px;
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.25);
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: #4ade80; letter-spacing: 0.05em;
  }
  .ia-pill::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 8px #4ade80;
  }
  .ia-grid {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: stretch;
  }
  .ia-card {
    padding: 22px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    line-height: 1.9;
  }
  .ia-card.allowed {
    border-color: rgba(74,222,128,0.3);
    background: rgba(74,222,128,0.03);
  }
  .ia-card-label {
    font-size: 10px; letter-spacing: 0.15em; color: #52525b;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .ia-card.allowed .ia-card-label { color: #4ade80; }
  .ia-arrow {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: #2dd4bf; font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
  }
  .ia-arrow svg { width: 28px; height: 28px; opacity: 0.7; }
  .ia-row { display: flex; gap: 10px; }
  .ia-key { color: #2dd4bf; }
  .ia-str { color: #fbbf24; }
  .ia-num { color: #d4d4d8; }
  .ia-cmt { color: #52525b; }
  .ia-foot {
    display: flex; flex-wrap: wrap; gap: 14px 28px;
    margin-top: 28px; padding-top: 22px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #a1a1aa;
  }
  .ia-foot-item { display: flex; align-items: center; gap: 8px; }
  .ia-dot { width: 7px; height: 7px; border-radius: 50%; }
  .ia-foot-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: rgba(45,212,191,0.06);
    border: 1px solid rgba(45,212,191,0.25);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #2dd4bf;
    margin-top: 22px;
  }
  .ia-foot-badge .arrow { color: #71717a; }

  /* ── Tab progress bar (auto-rotate) ─────────────────────────────── */
  .ia-progress-wrap {
    height: 2px; background: rgba(255,255,255,0.06);
    border-radius: 99px; margin-top: 14px; overflow: hidden;
  }
  .ia-progress-fill {
    height: 100%; width: 0%; background: #2dd4bf;
    box-shadow: 0 0 8px rgba(45,212,191,0.5);
    transition: width 0.1s linear;
  }

  /* ── Loop Detection animation (Panel 0) ─────────────────────────── */
  .flow-diagram {
    display: flex; align-items: center; gap: 0; width: 100%;
  }
  .fnode, .fgate, .fresult {
    display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .fnode-box, .fgate-box, .fresult-box {
    width: 72px; height: 72px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #a1a1aa;
    transition: border-color 0.4s, color 0.4s, box-shadow 0.4s;
  }
  .fnode-lbl {
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: #a1a1aa; white-space: nowrap;
  }
  .fgate-box {
    width: 140px; height: 100px; flex-direction: column; gap: 0;
    padding: 10px 12px; align-items: flex-start; justify-content: center;
  }
  .fgate-iter { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: #71717a; margin-top: 4px; }
  .fgate-iter strong { color: #d4d4d8; }
  .fzone {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-family: 'JetBrains Mono', monospace;
    color: #71717a; padding: 2px 0; transition: color 0.3s; white-space: nowrap;
  }
  .fzone-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #52525b;
    flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s;
  }
  .fzone.active-safe  { color: #4ade80; }
  .fzone.active-safe  .fzone-dot { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .fzone.active-gray  { color: #fbbf24; }
  .fzone.active-gray  .fzone-dot { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
  .fzone.active-storm { color: #f87171; }
  .fzone.active-storm .fzone-dot { background: #f87171; box-shadow: 0 0 6px #f87171; }
  .fpipe {
    flex: 1; position: relative; height: 72px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 0;
  }
  .fpipe-track { width: 100%; height: 1px; background: rgba(255,255,255,0.1); position: relative; overflow: visible; }
  .fpipe::after {
    content: ''; position: absolute; right: -1px; top: 50%;
    transform: translateY(-50%);
    border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    border-left: 6px solid rgba(255,255,255,0.15);
  }
  .fpipe-r::after { display: none; }
  .fpipe-lbl {
    position: absolute; top: calc(50% - 22px);
    font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #71717a; white-space: nowrap;
  }
  .fpkt {
    position: absolute; top: 50%; left: 0;
    width: 10px; height: 10px; border-radius: 50%;
    background: #2dd4bf; transform: translate(-50%, -50%) scale(0);
    box-shadow: 0 0 12px #2dd4bf, 0 0 4px #2dd4bf; transition: background 0.3s, box-shadow 0.3s;
    pointer-events: none;
    will-change: left, transform;
  }
  .fpkt.red { background: #f87171; box-shadow: 0 0 12px #f87171, 0 0 4px #f87171; }
  .fresult-box { font-size: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .fresult-box.allow { border-color: rgba(74,222,128,0.4); color: #4ade80; box-shadow: 0 0 24px rgba(74,222,128,0.12); }
  .fresult-box.block { border-color: rgba(248,113,113,0.4); color: #f87171; box-shadow: 0 0 24px rgba(248,113,113,0.12); }
  .fgate-box.eval { border-color: rgba(45,212,191,0.4); box-shadow: 0 0 24px rgba(45,212,191,0.12); }
  .iter-bar-wrap { margin-top: 28px; }
  .iter-bar-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; position: relative; overflow: visible; }
  .iter-bar-fill { height: 100%; border-radius: 99px; background: #4ade80; width: 0%;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1), background 0.4s; }
  .iter-threshold { position: absolute; top: -4px; width: 1px; height: 12px; background: rgba(255,255,255,0.18); }
  .iter-bar-labels {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #71717a;
  }
  .ibl-safe  { color: #4ade80; }
  .ibl-gray  { color: #fbbf24; }
  .ibl-storm { color: #f87171; }
  /* Pill state colors (loop detection) */
  .ia-pill.safe  { background: rgba(74,222,128,0.08);  border-color: rgba(74,222,128,0.3);  color: #4ade80; }
  .ia-pill.safe::before  { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  .ia-pill.gray  { background: rgba(251,191,36,0.08);  border-color: rgba(251,191,36,0.3);  color: #fbbf24; }
  .ia-pill.gray::before  { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
  .ia-pill.storm { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.3); color: #f87171; }
  .ia-pill.storm::before { background: #f87171; box-shadow: 0 0 8px #f87171; }

  /* ── Budget animation (Panel 1) ─────────────────────────────────── */
  .budget-demo { display: flex; flex-direction: column; gap: 18px; }
  .budget-agent-row { display: flex; align-items: center; gap: 14px; }
  .budget-agent-box {
    width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; color: #a1a1aa;
  }
  .budget-agent-name {
    font-size: 14px; font-weight: 600; color: #fff;
    display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace;
  }
  .budget-status-pill {
    font-size: 10px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
    padding: 2px 7px; border-radius: 4px;
    background: rgba(45,212,191,0.12); color: #2dd4bf;
    border: 1px solid rgba(45,212,191,0.25);
  }
  .budget-agent-id { font-size: 12px; color: #71717a; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .budget-meter-wrap {
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 14px 16px;
  }
  .budget-meter-header { display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
  .budget-meter-nums { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #fff; }
  .budget-bar-track { height: 8px; background: rgba(255,255,255,0.06); border-radius: 99px; position: relative; overflow: visible; }
  .budget-bar-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #4ade80, #fbbf24);
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1), background 0.6s;
  }
  .budget-bar-alert { position: absolute; top: -4px; width: 1px; height: 16px; background: #fbbf24; opacity: 0.6; }
  .budget-bar-legend { display: flex; justify-content: space-between; font-size: 10px; margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
  .budget-steps { display: flex; flex-direction: column; gap: 6px; }
  .budget-step-row {
    display: grid; grid-template-columns: 16px 1fr auto auto;
    gap: 12px; align-items: center;
    padding: 10px 14px;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
    font-size: 12px; transition: opacity 0.6s;
  }
  .bstep-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .bstep-dot.green  { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
  .bstep-dot.yellow { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }
  .bstep-dot.red    { background: #f87171; box-shadow: 0 0 6px #f87171; }
  .bstep-action { font-family: 'JetBrains Mono', monospace; color: #d4d4d8; }
  .bstep-cost   { font-family: 'JetBrains Mono', monospace; color: #71717a; }
  .bstep-status { font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .bstep-status.ok   { color: #4ade80; }
  .bstep-status.warn { color: #fbbf24; }
  .bstep-status.bad  { color: #f87171; }

  /* ── Token animation (Panel 2) ──────────────────────────────────── */
  .token-demo { display: flex; flex-direction: column; gap: 14px; }
  .token-flow-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; }
  .token-source-box, .token-result-box {
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Utilities ─────────────────────────────────────────────────────
function loadScriptOnce(src) {
  if (!src) return Promise.reject(new Error("missing_script_src"));
  window.__pgLoaded = window.__pgLoaded || {};
  if (window.__pgLoaded[src]) return window.__pgLoaded[src];
  window.__pgLoaded[src] = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error("script_load_failed"));
    document.head.appendChild(s);
  });
  return window.__pgLoaded[src];
}

// ── 3D Scene ─────────────────────────────────────────────────────
function Scene3D() {
  const mountRef = useRef(null);

  useEffect(() => {
    let cleanup = null;
    let cancelled = false;
    const mount = mountRef.current;
    if (!mount) return;

    const start = async () => {
      // Lazy-load Three.js so the landing isn't heavy on first paint.
      if (!window.THREE) {
        try {
          await loadScriptOnce("https://unpkg.com/three@0.160.0/build/three.min.js");
        } catch {
          // If Three fails to load, just skip the 3D scene (page still works).
          return;
        }
      }
      if (cancelled || !window.THREE) return;
      const THREE = window.THREE;

      const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, mount.clientWidth/mount.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    mount.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const point1 = new THREE.PointLight(0x2dd4bf, 3, 20); point1.position.set(0, 0, 2); scene.add(point1);
    const point2 = new THREE.PointLight(0x8b5cf6, 1.5, 20); point2.position.set(-3, 2, 2); scene.add(point2);
    const point3 = new THREE.PointLight(0x06b6d4, 1.5, 20); point3.position.set(3, -2, 2); scene.add(point3);

    // ── The Gate — SHIELD (wireframe) ───────────────────────────
    const gateGroup = new THREE.Group();
    gateGroup.position.set(3.5, -1.8, 0);

    // Build shield silhouette
    const shieldShape = new THREE.Shape();
    shieldShape.moveTo(0, 1);                                       // top center
    shieldShape.bezierCurveTo(0.3, 0.95, 0.6, 0.85, 0.85, 0.65);   // top-right curve
    shieldShape.lineTo(0.85, -0.15);                                // right side
    shieldShape.bezierCurveTo(0.85, -0.55, 0.5, -0.95, 0, -1.1);   // bottom-right curve to point
    shieldShape.bezierCurveTo(-0.5, -0.95, -0.85, -0.55, -0.85, -0.15); // bottom-left curve from point
    shieldShape.lineTo(-0.85, 0.65);                                // left side
    shieldShape.bezierCurveTo(-0.6, 0.85, -0.3, 0.95, 0, 1);       // top-left curve

    // Wireframe outline
    const shieldPts = shieldShape.getPoints(80);
    const shieldOutlineGeo = new THREE.BufferGeometry().setFromPoints(shieldPts);
    const shieldOutlineMat = new THREE.LineBasicMaterial({
      color: 0x2dd4bf, transparent: true, opacity: 0.95,
    });
    const shieldOutline = new THREE.Line(shieldOutlineGeo, shieldOutlineMat);
    gateGroup.add(shieldOutline);

    // Inner shield (smaller, subtle)
    const innerShield = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(
        shieldShape.getPoints(80).map(p => new THREE.Vector2(p.x * 0.7, p.y * 0.7))
      ),
      new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 0.35 })
    );
    gateGroup.add(innerShield);

    // Center checkmark (the "approved" symbol)
    const checkPts = [
      new THREE.Vector3(-0.22, 0.05, 0),
      new THREE.Vector3(-0.05, -0.15, 0),
      new THREE.Vector3(0.28, 0.25, 0),
    ];
    const checkGeo = new THREE.BufferGeometry().setFromPoints(checkPts);
    const checkMat = new THREE.LineBasicMaterial({ color: 0x2dd4bf, transparent: true, opacity: 1, linewidth: 2 });
    const checkLine = new THREE.Line(checkGeo, checkMat);
    gateGroup.add(checkLine);

    // Subtle backing glow (transparent)
    const glowGeo = new THREE.ShapeGeometry(shieldShape);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x2dd4bf, transparent: true, opacity: 0.05, side: THREE.DoubleSide,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    gateGroup.add(glow);

    scene.add(gateGroup);
    // Aliases for animation refs (preserve existing variable names)
    const octWire = shieldOutline;
    const core = checkLine;
    const ring = innerShield;
    const ringMat = innerShield.material;

    // ── Agents (icosahedrons orbiting on left) ──────────────────
    const agents = [];
    const agentColors = [0x2dd4bf, 0x06b6d4, 0x8b5cf6, 0xfbbf24, 0xf87171];
    // Each agent = a small "AI chip" (low-profile box + LED indicator + wireframe edges)
    for (let i = 0; i < 6; i++) {
      const color = agentColors[i % agentColors.length];

      // Chip body (rectangular, like a CPU package)
      const bodyGeo = new THREE.BoxGeometry(0.45, 0.45, 0.12);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x1a1a24, metalness: 0.4, roughness: 0.6,
      });
      const chip = new THREE.Mesh(bodyGeo, bodyMat);

      // Wireframe edges (the "circuit" outline)
      const edgesGeo = new THREE.EdgesGeometry(bodyGeo);
      const edgesMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 });
      const edges = new THREE.LineSegments(edgesGeo, edgesMat);
      chip.add(edges);

      // Inner pads (4 small dots on top face — like CPU connectors)
      const padGeo = new THREE.BoxGeometry(0.06, 0.06, 0.02);
      const padMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 });
      const padPositions = [[-0.13, 0.13], [0.13, 0.13], [-0.13, -0.13], [0.13, -0.13]];
      padPositions.forEach(([px, py]) => {
        const pad = new THREE.Mesh(padGeo, padMat);
        pad.position.set(px, py, 0.07);
        chip.add(pad);
      });

      // Tiny LED indicator (glowing dot, top-right)
      const ledGeo = new THREE.SphereGeometry(0.035, 12, 12);
      const ledMat = new THREE.MeshBasicMaterial({ color });
      const led = new THREE.Mesh(ledGeo, ledMat);
      led.position.set(0.16, 0.16, 0.08);
      chip.add(led);
      const ledLight = new THREE.PointLight(color, 0.6, 0.6);
      led.add(ledLight);

      chip.userData = {
        offset: Math.random() * Math.PI * 2,
        color, led,
      };
      chip.position.x = -4 - Math.random() * 0.5;
      chip.position.y = -2.8 + i * 0.5;
      chip.position.z = (Math.random() - 0.5) * 1.0;
      agents.push(chip);
      scene.add(chip);
    }

    // ── Particles flowing toward gate ───────────────────────────
    const particles = [];
    // Quadratic bezier sampler
    function sampleBezier(out, a, b, c, t) {
      const u = 1 - t;
      out.x = u*u*a.x + 2*u*t*b.x + t*t*c.x;
      out.y = u*u*a.y + 2*u*t*b.y + t*t*c.y;
      out.z = u*u*a.z + 2*u*t*b.z + t*t*c.z;
    }

    function spawnParticle(fromAgent) {
      const isBlocked = Math.random() < 0.25;
      const color = isBlocked ? 0xf87171 : 0x2dd4bf;

      const from = fromAgent.position.clone();
      const to   = new THREE.Vector3(3.5 + (Math.random()-0.5)*0.2, -1.8 + (Math.random()-0.5)*0.2, 0);
      const mid  = new THREE.Vector3(
        (from.x + to.x) * 0.5,
        Math.min(from.y, to.y) - 0.5 + Math.random() * 0.4,
        (Math.random() - 0.5) * 0.5,
      );

      // Build curve as 24 sample points along bezier
      const numPts = 24;
      const pts = [];
      const tmp = new THREE.Vector3();
      for (let i = 0; i < numPts; i++) {
        const tt = i / (numPts - 1);
        sampleBezier(tmp, from, mid, to, tt);
        pts.push(tmp.clone());
      }

      // Beam = a Line with empty geometry (we draw a sliding window of segments)
      const beamGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(numPts * 3);
      const colors = new Float32Array(numPts * 3);
      beamGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      beamGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const beamMat = new THREE.LineBasicMaterial({
        vertexColors: true, transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending,
      });
      const beam = new THREE.Line(beamGeo, beamMat);

      // Tiny head dot (small bright sphere)
      const headGeo = new THREE.SphereGeometry(0.04, 8, 8);
      const headMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
      const head = new THREE.Mesh(headGeo, headMat);
      const headLight = new THREE.PointLight(color, 1.2, 1.4);
      head.add(headLight);
      beam.add(head);

      beam.userData = {
        progress: 0,
        from, mid, to, pts,
        positions, colors, numPts,
        head, color: new THREE.Color(color),
        through: new THREE.Vector3(7 + Math.random()*1, to.y + (Math.random()-0.5)*0.8, (Math.random()-0.5)*0.4),
        blocked: isBlocked,
        speed: 0.012 + Math.random()*0.006,
      };
      particles.push(beam);
      scene.add(beam);
    }

    // ── Background star field ───────────────────────────────────
    const starGeo = new THREE.BufferGeometry();
    const starCount = 300;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i*3]   = (Math.random()-0.5) * 30;
      starPos[i*3+1] = (Math.random()-0.5) * 20;
      starPos[i*3+2] = (Math.random()-0.5) * 20 - 5;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({
      color: 0xffffff, size: 0.025, transparent: true, opacity: 0.5,
      sizeAttenuation: true,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ── Animation loop ──────────────────────────────────────────
    let frame = 0;
    let spawnTimer = 0;
    const clock = new THREE.Clock();
    let mouseX = 0, mouseY = 0;

    const onMouse = (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.3;
    };
    window.addEventListener('mousemove', onMouse);

    function animate() {
      frame = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = clock.getDelta();

      // Camera parallax (subtle)
      camera.position.x += (mouseX * 0.8 - camera.position.x) * 0.04;
      camera.position.y += (-mouseY * 0.8 - camera.position.y) * 0.04;
      camera.lookAt(0, -1, 0);

      // Shield: gentle horizontal sway + pulse (it's a defensive symbol — should feel solid)
      gateGroup.rotation.y = Math.sin(t * 0.6) * 0.15;
      const pulse = 1 + Math.sin(t * 1.8) * 0.04;
      gateGroup.scale.set(pulse, pulse, pulse);
      // Checkmark fade-in cycle (suggests "approved")
      core.material.opacity = 0.6 + Math.sin(t * 2) * 0.4;
      // Inner shield breathing
      ringMat.opacity = 0.25 + Math.sin(t * 1.5) * 0.15;

      // Stars slow rotation
      stars.rotation.y = t * 0.02;

      // Animate chips (subtle rotation around Y, gentle float)
      agents.forEach((a, i) => {
        a.rotation.y = Math.sin(t * 0.8 + a.userData.offset) * 0.4;
        a.rotation.x = Math.sin(t * 0.5 + a.userData.offset) * 0.15;
        const baseY = -2.8 + i * 0.5;
        a.position.y = baseY + Math.sin(t * 1.0 + a.userData.offset) * 0.12;
        a.position.x = -4.0 + Math.sin(t * 0.4 + a.userData.offset) * 0.2;
        // LED pulse
        if (a.userData.led) {
          a.userData.led.material.opacity = 0.7 + Math.sin(t * 3 + i) * 0.3;
          a.userData.led.material.transparent = true;
        }
      });

      // Spawn particles (more frequent)
      spawnTimer += dt;
      if (spawnTimer > 0.08) {
        spawnTimer = 0;
        const from = agents[Math.floor(Math.random() * agents.length)];
        spawnParticle(from);
      }

      // Animate beams (trails fade behind a moving head along bezier)
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.userData.progress += p.userData.speed;
        const t2 = p.userData.progress;
        const u = p.userData;

        // Head position along bezier
        const headT = u.blocked
          ? (t2 < 0.55 ? t2 / 0.55 : 1 - (t2 - 0.55) / 0.45) // forward then back
          : Math.min(t2 * 2, 1);

        // Update head position
        if (!u.blocked && t2 > 0.5) {
          // Past gate — fly off through
          const tt = (t2 - 0.5) * 2;
          u.head.position.lerpVectors(u.to, u.through, tt);
          u.head.material.opacity = Math.max(0, 1 - tt * 0.9);
          // Hide trail (set all to head pos)
          for (let j = 0; j < u.numPts; j++) {
            u.positions[j*3]   = u.head.position.x;
            u.positions[j*3+1] = u.head.position.y;
            u.positions[j*3+2] = u.head.position.z;
          }
        } else {
          // Active trail along bezier
          const headPt = new THREE.Vector3();
          sampleBezier(headPt, u.from, u.mid, u.to, headT);
          u.head.position.copy(headPt);
          u.head.material.opacity = 1;

          // Tail length: 8 sample points behind head
          const tailLen = 0.35;
          for (let j = 0; j < u.numPts; j++) {
            const ptT = j / (u.numPts - 1);
            // Map: when ptT == headT → bright; behind → fade; ahead → invisible
            const dist = headT - ptT;
            let alpha = 0;
            if (dist >= 0 && dist < tailLen) {
              alpha = 1 - (dist / tailLen);
            }
            const pos = new THREE.Vector3();
            sampleBezier(pos, u.from, u.mid, u.to, ptT);
            u.positions[j*3]   = pos.x;
            u.positions[j*3+1] = pos.y;
            u.positions[j*3+2] = pos.z;
            u.colors[j*3]   = u.color.r * alpha;
            u.colors[j*3+1] = u.color.g * alpha;
            u.colors[j*3+2] = u.color.b * alpha;
          }
          p.geometry.attributes.position.needsUpdate = true;
          p.geometry.attributes.color.needsUpdate = true;
        }

        if (p.userData.progress >= 1) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          u.head.geometry.dispose();
          u.head.material.dispose();
          particles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // ── Resize ──────────────────────────────────────────────────
    const onResize = () => {
      camera.aspect = mount.clientWidth / mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    };
    window.addEventListener('resize', onResize);

      cleanup = () => {
      cancelAnimationFrame(frame);
      window.removeEventListener('mousemove', onMouse);
      window.removeEventListener('resize', onResize);
      mount.removeChild(renderer.domElement);
      renderer.dispose();
      };
    };

    start();
    return () => {
      cancelled = true;
      if (cleanup) cleanup();
    };
  }, []);

  return <div id="scene" ref={mountRef}></div>;
}

// ── The flow demo: agents → gate → allowed/blocked ─────────────────
const FLOW_AGENTS = [
  { name: "scraper-prod-1",   color: "#2dd4bf", meta: "scraper" },
  { name: "research-agent",   color: "#8b5cf6", meta: "llm" },
  { name: "tool-orchestrator",color: "#fbbf24", meta: "router" },
  { name: "crawler-bot",      color: "#06b6d4", meta: "crawler" },
  { name: "analyst-agent",    color: "#f87171", meta: "llm" },
];

// SVG coordinate space (we use viewBox 0 0 700 360)
const VB_W = 700, VB_H = 360;
const AGENT_X = 12;
const GATE_X = VB_W / 2;
const GATE_Y = VB_H / 2;
const ALLOWED_X = VB_W - 12;
const ALLOWED_Y = 90;
const BLOCKED_X = VB_W - 12;
const BLOCKED_Y = 270;
const AGENT_SLOTS = FLOW_AGENTS.map((_, i) => 36 + i * 64);

function FlowDemo({ background = false }) {
  const [requests, setRequests] = useState([]);
  const [allowed, setAllowed] = useState(1847);
  const [blocked, setBlocked] = useState(23);
  const [activeAgents, setActiveAgents] = useState(new Set());
  const [pulses, setPulses] = useState([]);
  const reqId = useRef(0);
  const pulseId = useRef(0);

  // Spawn requests at intervals
  useEffect(() => {
    const i = setInterval(() => {
      const id = reqId.current++;
      const isBlocked = Math.random() < 0.18;
      const agentIdx = Math.floor(Math.random() * FLOW_AGENTS.length);
      const start = performance.now();
      setRequests(r => [...r, { id, agentIdx, blocked: isBlocked, start }]);
      // Highlight agent briefly
      setActiveAgents(prev => {
        const next = new Set(prev); next.add(agentIdx); return next;
      });
      setTimeout(() => {
        setActiveAgents(prev => {
          const next = new Set(prev); next.delete(agentIdx); return next;
        });
      }, 600);
    }, 280);
    return () => clearInterval(i);
  }, []);

  // Animation loop — update positions & retire completed
  useEffect(() => {
    let frame;
    const DURATION = 1500;
    const tick = () => {
      const now = performance.now();
      let toAllowed = 0, toBlocked = 0;
      const newPulses = [];
      setRequests(rs => {
        const active = [];
        for (const r of rs) {
          const t = (now - r.start) / DURATION;
          if (t >= 1) {
            if (r.blocked) toBlocked++; else toAllowed++;
            // emit pulse at outcome
            const px = r.blocked ? BLOCKED_X - 60 : ALLOWED_X - 60;
            const py = r.blocked ? BLOCKED_Y : ALLOWED_Y;
            newPulses.push({ id: pulseId.current++, x: px, y: py, blocked: r.blocked });
          } else {
            active.push(r);
          }
        }
        return active;
      });
      if (toAllowed) setAllowed(a => a + toAllowed);
      if (toBlocked) setBlocked(b => b + toBlocked);
      if (newPulses.length) {
        setPulses(p => [...p, ...newPulses]);
        // Auto-cleanup pulses after 800ms
        newPulses.forEach(np => {
          setTimeout(() => setPulses(p => p.filter(x => x.id !== np.id)), 800);
        });
      }
      frame = requestAnimationFrame(tick);
    };
    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  }, []);

  // Compute request dot position at time t (0..1)
  function reqPos(req) {
    const elapsed = (performance.now() - req.start) / 1500;
    const t = Math.max(0, Math.min(1, elapsed));
    const ay = AGENT_SLOTS[req.agentIdx];

    if (req.blocked) {
      // 0..0.55 → agent → gate, then bounce to BLOCKED bin
      if (t < 0.55) {
        const tt = t / 0.55;
        const x = AGENT_X + (GATE_X - AGENT_X) * tt;
        const y = ay + (GATE_Y - ay) * tt;
        return { x, y, color: "#2dd4bf", opacity: 1 };
      }
      const tt = (t - 0.55) / 0.45;
      const x = GATE_X + (BLOCKED_X - 60 - GATE_X) * tt;
      const y = GATE_Y + (BLOCKED_Y - GATE_Y) * tt;
      return { x, y, color: "#f87171", opacity: 1 - tt * 0.3 };
    } else {
      // 0..0.5 → agent → gate, 0.5..1 → gate → ALLOWED
      if (t < 0.5) {
        const tt = t / 0.5;
        const x = AGENT_X + (GATE_X - AGENT_X) * tt;
        const y = ay + (GATE_Y - ay) * tt;
        return { x, y, color: "#2dd4bf", opacity: 1 };
      }
      const tt = (t - 0.5) / 0.5;
      const x = GATE_X + (ALLOWED_X - 60 - GATE_X) * tt;
      const y = GATE_Y + (ALLOWED_Y - GATE_Y) * tt;
      return { x, y, color: "#4ade80", opacity: 1 };
    }
  }

  // Force re-render on each frame (positions are time-derived)
  const [, setTick] = useState(0);
  useEffect(() => {
    let f;
    const loop = () => { setTick(x => x+1); f = requestAnimationFrame(loop); };
    f = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(f);
  }, []);

  return (
    <div className={`flow-demo${background ? ' bg' : ''}`}>
      <div className="flow-demo-header">
        <div className="flow-demo-title">
          Live · Last 60 seconds
        </div>
        <div className="flow-demo-live">
          {(allowed + blocked).toLocaleString()} decisions
        </div>
      </div>
      <div className="flow-grid">
        {/* LEFT: Agents */}
        <div className="flow-agents">
          {FLOW_AGENTS.map((a, i) => (
            <div key={i} className={`flow-agent ${activeAgents.has(i) ? 'active' : ''}`}>
              <span className="flow-agent-dot" style={{ background: a.color, color: a.color }}></span>
              <span className="flow-agent-name">{a.name}</span>
              <span className="flow-agent-meta">{a.meta}</span>
            </div>
          ))}
        </div>

        {/* CENTER: SVG canvas with paths + animated dots, gate card overlay */}
        <div className="flow-canvas">
          <svg viewBox={`0 0 ${VB_W} ${VB_H}`} preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stopColor="rgba(45,212,191,0.05)" />
                <stop offset="50%"  stopColor="rgba(45,212,191,0.2)" />
                <stop offset="100%" stopColor="rgba(45,212,191,0.05)" />
              </linearGradient>
              <radialGradient id="dotGlow">
                <stop offset="0%"   stopColor="rgba(45,212,191,0.6)" />
                <stop offset="100%" stopColor="rgba(45,212,191,0)" />
              </radialGradient>
            </defs>

            {/* Static "tracks" — agents → gate */}
            {FLOW_AGENTS.map((_, i) => (
              <path
                key={`pa-${i}`}
                d={`M ${AGENT_X} ${AGENT_SLOTS[i]} Q ${GATE_X * 0.55} ${AGENT_SLOTS[i]} ${GATE_X} ${GATE_Y}`}
                fill="none"
                stroke="rgba(45,212,191,0.10)"
                strokeWidth="1"
                strokeDasharray="2 4"
              />
            ))}
            {/* Gate → Allowed */}
            <path
              d={`M ${GATE_X} ${GATE_Y} Q ${(GATE_X+ALLOWED_X)/2} ${GATE_Y} ${ALLOWED_X-60} ${ALLOWED_Y}`}
              fill="none" stroke="rgba(74,222,128,0.15)" strokeWidth="1" strokeDasharray="2 4"
            />
            {/* Gate → Blocked */}
            <path
              d={`M ${GATE_X} ${GATE_Y} Q ${(GATE_X+BLOCKED_X)/2} ${GATE_Y} ${BLOCKED_X-60} ${BLOCKED_Y}`}
              fill="none" stroke="rgba(248,113,113,0.15)" strokeWidth="1" strokeDasharray="2 4"
            />

            {/* Animated request dots */}
            {requests.map(r => {
              const p = reqPos(r);
              return (
                <g key={r.id} style={{ opacity: p.opacity }}>
                  <circle cx={p.x} cy={p.y} r="6" fill={p.color} opacity="0.25"/>
                  <circle cx={p.x} cy={p.y} r="3" fill={p.color}/>
                </g>
              );
            })}

            {/* Outcome pulse rings */}
            {pulses.map(pl => (
              <circle
                key={pl.id} className="flow-pulse"
                cx={pl.x} cy={pl.y} r="4"

    { id: 0, label: "Loop Detection",  icon: <><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></> },
    { id: 1, label: "Budget Control",  icon: <><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M7 8h10M7 12h6"/></> },
    { id: 2, label: "Signed Proof",    icon: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/> },

  ];

  // Auto-rotate tabs with progress bar
  useEffect(() => {
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const elapsed = now - start;
      const pct = Math.min(100, (elapsed / TAB_DURATION) * 100);
      setProgress(pct);
      if (pct < 100) {
        raf = requestAnimationFrame(tick);
      } else {
        setTab(t => (t + 1) % tabs.length);
      }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [tab]);

  const handleTabClick = (i) => { setTab(i); setProgress(0); };

  return (
    <section className="section-pad" id="in-action">
      <div className="container">
        <span className="eyebrow">In action</span>
        <h2 className="section-title">Every agent decision,<br/>governed.</h2>

          and five SDK integrations.

        <div className="ia-tabs">
          {tabs.map(t => (

}

// ── Panel 0: Loop Detection (animated packet flow) ─────────────────
function IAPanelLoop() {
  const scenarios = [
    { iter: 2,  zone: 'safe',  decision: 'allow', label: 'iteration 2 · normal operation', bar: 18 },
    { iter: 8,  zone: 'gray',  decision: 'allow', label: 'iteration 8 · AI evaluation',    bar: 72 },
    { iter: 11, zone: 'storm', decision: 'block', label: 'iteration 11 · loop detected',   bar: 100 },
  ];
  const barColors = { safe: '#4ade80', gray: '#fbbf24', storm: '#f87171' };

  const [scenario, setScenario] = useState(scenarios[0]);
  const [pktL, setPktL]   = useState({ x: 0, scale: 0, red: false });
  const [pktR, setPktR]   = useState({ x: 0, scale: 0, red: false });
  const [gateEval, setGateEval] = useState(false);
  const [activeZone, setActiveZone] = useState(null);
  const [result, setResult] = useState({ text: '—', label: '—', state: '' });

  const abortRef = useRef(false);

  useEffect(() => {
    abortRef.current = false;
    let idx = 0;

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    const animatePacket = (setter, fromPct, toPct, durationMs) => new Promise(resolve => {
      const start = performance.now();
      setter({ x: fromPct, scale: 1, red: false });
      const frame = (now) => {
        if (abortRef.current) return resolve();
        const t = Math.min((now - start) / durationMs, 1);
        const ease = t < 0.5 ? 2*t*t : -1 + (4 - 2*t) * t;
        const pct = fromPct + (toPct - fromPct) * ease;
        setter(prev => ({ ...prev, x: pct }));
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      };
      requestAnimationFrame(frame);
    });

    const reset = () => {
      setPktL({ x: 0, scale: 0, red: false });
      setPktR({ x: 0, scale: 0, red: false });
      setGateEval(false);
      setActiveZone(null);
      setResult({ text: '—', label: '—', state: '' });
    };

    const runScenario = async (s) => {
      if (abortRef.current) return;
      setScenario(s);
      await sleep(150); if (abortRef.current) return;
      await animatePacket(setPktL, 0, 1, 380); if (abortRef.current) return;
      await sleep(50); if (abortRef.current) return;
      setPktL({ x: 0, scale: 0, red: false });
      setGateEval(true);
      setActiveZone(s.zone);
      await sleep(s.zone === 'gray' ? 350 : 220); if (abortRef.current) return;

      if (s.decision === 'allow') {
        await animatePacket(setPktR, 0, 1, 380); if (abortRef.current) return;
        await sleep(50); if (abortRef.current) return;
        setPktR({ x: 0, scale: 0, red: false });
        setResult({ text: 'ALLOW', label: 'proceed_token ✓', state: 'allow' });
      } else {
        setPktR({ x: 0.3, scale: 1, red: true });
        await sleep(180); if (abortRef.current) return;
        setPktR({ x: 0, scale: 0, red: false });
        setResult({ text: 'BLOCK', label: '429 loop_detected', state: 'block' });
      }
      await sleep(1000);
    };

    const loop = async () => {
      await sleep(200);
      while (!abortRef.current) {
        const s = scenarios[idx % scenarios.length];
        reset();
        await sleep(150);
        if (abortRef.current) break;
        await runScenario(s);
        idx++;
      }
    };
    loop();
    return () => { abortRef.current = true; };
  }, []);

  return (
    <>
      <div className={`ia-pill ${scenario.zone}`}>{scenario.label}</div>
      <div className="flow-diagram">
        <div className="fnode">
          <div className="fnode-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </div>
          <span className="fnode-lbl">agent</span>
        </div>
        <div className="fpipe">
          <div className="fpipe-track">
            <div className="fpkt" style={{left: (pktL.x*100)+'%', transform: `translate(-50%, -50%) scale(${pktL.scale})`}}></div>
          </div>
          <span className="fpipe-lbl">POST /check</span>
        </div>
        <div className="fgate">
          <div className={`fgate-box ${gateEval ? 'eval' : ''}`}>
            <div className={`fzone ${activeZone === 'safe'  ? 'active-safe'  : ''}`}><span className="fzone-dot"></span>safe · ≤5</div>
            <div className={`fzone ${activeZone === 'gray'  ? 'active-gray'  : ''}`}><span className="fzone-dot"></span>gray · 6–10</div>
            <div className={`fzone ${activeZone === 'storm' ? 'active-storm' : ''}`}><span className="fzone-dot"></span>storm · &gt;10</div>
          </div>
          <span className="fgate-iter">iter <strong>{scenario.iter}</strong></span>
          <span className="fnode-lbl">ProceedGate</span>
        </div>
        <div className="fpipe fpipe-r">
          <div className="fpipe-track">
            <div className={`fpkt ${pktR.red ? 'red' : ''}`} style={{left: (pktR.x*100)+'%', transform: `translate(-50%, -50%) scale(${pktR.scale})`}}></div>
          </div>
        </div>
        <div className="fresult">
          <div className={`fresult-box ${result.state}`}>{result.text}</div>
          <span className="fnode-lbl">{result.label}</span>
        </div>
      </div>
      <div className="iter-bar-wrap">
        <div className="iter-bar-track">
          <div className="iter-bar-fill" style={{width: scenario.bar + '%', background: barColors[scenario.zone]}}></div>
          <div className="iter-threshold" style={{left:'45%'}}></div>
          <div className="iter-threshold" style={{left:'90%'}}></div>
        </div>
        <div className="iter-bar-labels">
          <span>0</span><span className="ibl-safe">safe</span><span className="ibl-gray">gray</span><span className="ibl-storm">storm</span><span>11+</span>
        </div>
      </div>
      <div className="ia-foot">
        <div className="ia-foot-item"><span className="ia-dot" style={{background:"#4ade80",boxShadow:"0 0 6px #4ade80"}}></span>≤5 iterations — allowed immediately</div>
        <div className="ia-foot-item"><span className="ia-dot" style={{background:"#fbbf24",boxShadow:"0 0 6px #fbbf24"}}></span>6–10 — gray zone (allowed, flagged)</div>
        <div className="ia-foot-item"><span className="ia-dot" style={{background:"#f87171",boxShadow:"0 0 6px #f87171"}}></span>≥11 — hard block, 429 returned</div>
      </div>
    </>
  );
}
