name = "agent-cost-governor"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[[durable_objects.bindings]]
name = "DECISIONS"
class_name = "DecisionStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DecisionStoreDO"]

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "proceedgate_metrics"

[env.prod]
# Deploy prod config into the same worker name to own the route.
name = "agent-cost-governor"
# Production routes
routes = [
	{ pattern = "governor.proceedgate.dev/*", zone_name = "proceedgate.dev" }
]

[env.prod.vars]
# Keep prod behavior consistent with dev defaults (override in dashboard if needed)
X402_PRICE_DEFAULT = "0.004 USDC"
X402_CHAIN = "Base"
X402_RECIPIENT = "0xYourWalletAddress"
PROCEED_TOKEN_TTL_SECONDS = "45"
PAYMENT_VERIFY_MODE = "facilitator"
FACILITATOR_URL = "https://governor.proceedgate.dev/x402/verify"

[[env.prod.analytics_engine_datasets]]
binding = "METRICS"
dataset = "proceedgate_metrics"

[[env.prod.durable_objects.bindings]]
name = "DECISIONS"
class_name = "DecisionStoreDO"

[vars]
# Pricing / payment headers (x402-style)
X402_PRICE_DEFAULT = "0.004 USDC"
X402_CHAIN = "Base"
X402_RECIPIENT = "0xYourWalletAddress"

# JWT settings
PROCEED_TOKEN_TTL_SECONDS = "45"

# In MVP, payment verification is stubbed (accepts any x402-tx-hash).
# For production, implement real verification or a facilitator.
PAYMENT_VERIFY_MODE = "stub"
