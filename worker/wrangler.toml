name = "agent-cost-governor"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "DECISIONS"
class_name = "DecisionStoreDO"

[[durable_objects.bindings]]
name = "BILLING"
class_name = "BillingStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DecisionStoreDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BillingStoreDO"]

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "proceedgate_metrics"

[env.prod]
# Deploy prod config into the same worker name to own the route.
name = "agent-cost-governor"
# Production routes
routes = [
	{ pattern = "governor.proceedgate.dev/*", zone_name = "proceedgate.dev" }
]

[env.prod.vars]
# Keep prod behavior consistent with dev defaults (override in dashboard if needed)
X402_PRICE_DEFAULT = "0.004 USDC"
X402_CHAIN = "Base"
X402_RECIPIENT = "0x607Fc9D41858Aa23065275043698a9262F8f9bf9"
PROCEED_TOKEN_TTL_SECONDS = "45"
PAYMENT_VERIFY_MODE = "facilitator"
FACILITATOR_URL = "internal"

# Never allow stub tx hashes in production.
ALLOW_STUB_TX = "false"

# Production auth: per-workspace API keys (stored hashed in the BILLING DO).
API_AUTH_MODE = "workspace"

# Production billing: prepaid credits.
BILLING_MODE = "credits"
# Price per check in microUSDC (1e-6 USDC). Default is 10 if unset.
BILLING_CREDIT_COST_MICROUSDC = "10"

# Billing recipient (credits top-ups)
BILLING_RECIPIENT = "0x607Fc9D41858Aa23065275043698a9262F8f9bf9"

[[env.prod.analytics_engine_datasets]]
binding = "METRICS"
dataset = "proceedgate_metrics"

[[env.prod.durable_objects.bindings]]
name = "DECISIONS"
class_name = "DecisionStoreDO"

[[env.prod.durable_objects.bindings]]
name = "BILLING"
class_name = "BillingStoreDO"

[vars]
# Pricing / payment headers (x402-style)
X402_PRICE_DEFAULT = "0.004 USDC"
X402_CHAIN = "Base"
X402_RECIPIENT = "0x607Fc9D41858Aa23065275043698a9262F8f9bf9"

# Billing recipient (credits top-ups)
BILLING_RECIPIENT = "0x607Fc9D41858Aa23065275043698a9262F8f9bf9"

# JWT settings
PROCEED_TOKEN_TTL_SECONDS = "45"

# Default local behavior: verify via the in-worker facilitator verifier.
# Dev shortcut: tx_hash starting with 0xstub is accepted without an RPC (only when ALLOW_STUB_TX=true).
PAYMENT_VERIFY_MODE = "facilitator"
FACILITATOR_URL = "internal"

# Dev-only escape hatch for local demos. Do NOT set in prod.
# Defaults to false — billing/hackathon envs override as needed.
ALLOW_STUB_TX = "false"

# API auth defaults (off by default; enable per env)
API_AUTH_MODE = "off"

[env.billing]
# Convenience environment for local demos: enables credits billing.
# Run with: wrangler dev --env billing

[env.billing.vars]
# Inherit core vars (wrangler envs do NOT inherit top-level [vars])
X402_PRICE_DEFAULT = "0.004 USDC"
X402_CHAIN = "Base"
X402_RECIPIENT = "0x607Fc9D41858Aa23065275043698a9262F8f9bf9"
BILLING_RECIPIENT = "0x607Fc9D41858Aa23065275043698a9262F8f9bf9"
PROCEED_TOKEN_TTL_SECONDS = "45"

BILLING_MODE = "credits"
PAYMENT_VERIFY_MODE = "facilitator"
FACILITATOR_URL = "internal"
ALLOW_STUB_TX = "true"

# Local demo: enable per-workspace API keys
API_AUTH_MODE = "workspace"
# ⚠ Local-only — NEVER use in prod. Override via wrangler secret.
API_ADMIN_KEY = "dev-admin-key"

[[env.billing.analytics_engine_datasets]]
binding = "METRICS"
dataset = "proceedgate_metrics"

[[env.billing.durable_objects.bindings]]
name = "DECISIONS"
class_name = "DecisionStoreDO"

[[env.billing.durable_objects.bindings]]
name = "BILLING"
class_name = "BillingStoreDO"

[env.hackathon]
# Hackathon-focused environment (OpenClaw-style): chain defaults on opBNB.
# Run locally with: wrangler dev --env hackathon

[env.hackathon.vars]
X402_PRICE_DEFAULT = "0.004 USDC"
X402_CHAIN = "BSC"
X402_RECIPIENT = "0xc30ac7ab7fbb2f0cb82c6d49b65df362b5ac1769"
BILLING_RECIPIENT = "0xc30ac7ab7fbb2f0cb82c6d49b65df362b5ac1769"
PROCEED_TOKEN_TTL_SECONDS = "45"

BILLING_MODE = "credits"
PAYMENT_VERIFY_MODE = "facilitator"
FACILITATOR_URL = "internal"
ALLOW_STUB_TX = "false"
BILLING_CHAIN = "BSC"

BASE_RPC_URL = "https://mainnet.base.org"
BSC_RPC_URL = "https://bsc-dataseed.binance.org"
OPBNB_RPC_URL = "https://opbnb-mainnet-rpc.bnbchain.org"

# Auth for evaluator-friendly workspace keys
API_AUTH_MODE = "workspace"

[[env.hackathon.analytics_engine_datasets]]
binding = "METRICS"
dataset = "proceedgate_metrics"

[[env.hackathon.durable_objects.bindings]]
name = "DECISIONS"
class_name = "DecisionStoreDO"

[[env.hackathon.durable_objects.bindings]]
name = "BILLING"
class_name = "BillingStoreDO"

[env.hackathon.ai]
binding = "AI"
