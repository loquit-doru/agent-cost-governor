---
name: OnchainCostGovernor
description: Gates expensive AI actions through verifiable onchain stake checks on BNB Chain.
version: 1.0.0
dependencies:
  - ethers
  - viem
---

inputs:
  - name: actorAddress
    type: string
    required: true
  - name: action
    type: string
    required: true
  - name: estimatedCostUsd
    type: number
    required: true
  - name: chain
    type: string
    required: false
    default: bsc

outputs:
  - name: allowed
    type: boolean
  - name: reason
    type: string
  - name: txHash
    type: string
  - name: recommendation
    type: string

instructions: |
  1) Validate actorAddress and selected chain (bsc/opbnb).
  2) Query the deployed AICostGovernor contract `checkApproval(actorAddress)`.
  3) If approved=true, return allowed=true and continue autonomous action pipeline.
  4) If approved=false, return allowed=false and recommendation to run `stakeForAction()`.
  5) For high-risk actions, require human confirmation before sending staking transaction.
  6) Log decision_id, chain, actorAddress, and tx proof for auditability.
