[project]
name = "proceedgate-crewai"
version = "1.1.0"
description = "CrewAI integration for ProceedGate cost governance"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ProceedGate" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://proceedgate.dev/docs.html#sdk-crewai"
Repository = "https://github.com/proceedgate/agent-cost-governor"
Documentation = "https://proceedgate.dev/docs.html#sdk-crewai"

[project.optional-dependencies]
crewai = ["crewai>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proceedgate_crewai"]
